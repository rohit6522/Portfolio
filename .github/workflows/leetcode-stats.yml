name: Update Coding Platform Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch LeetCode, GFG & HackerRank stats
        run: node scripts/fetch-coding-stats.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/leetcode-stats.json public/coding-stats.json
          git diff --staged --quiet || git commit -m "chore: update LeetCode, GFG & HackerRank stats [automated]"
          git push
